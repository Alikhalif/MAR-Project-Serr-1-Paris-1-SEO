<!-- src/app/components/pricing-transparency/pricing-transparency.component.html -->
<section class="pricing">
  <div class="pricing__container">
    <div class="pricing__content">
      <h2 class="pricing__title">{{ data().title }}</h2>
      <p class="pricing__description">{{ data().description }}</p>

      <div class="pricing__highlight">
        <span class="pricing__highlight-icon" aria-hidden="true">✓</span>
        <strong>{{ data().highlight }}</strong>
      </div>

      <ul class="pricing__features">
        @for (feature of data().features; track feature) {
          <li class="pricing__feature">
            <span class="pricing__feature-icon" aria-hidden="true">✓</span>
            {{ feature }}
          </li>
        }
      </ul>
    </div>

    <div class="pricing__visual" aria-hidden="true">
      <div class="pricing__card">
        <div class="pricing__card-header">
          <span class="pricing__card-icon">💰</span>
          <span class="pricing__card-title">Tarification Claire</span>
        </div>
        <div class="pricing__card-content">
          <div class="pricing__card-item">
            <span>Déplacement</span>
            <span class="pricing__card-value">Inclus</span>
          </div>
          <div class="pricing__card-item">
            <span>Main-d'œuvre</span>
            <span class="pricing__card-value">Transparent</span>
          </div>
          <div class="pricing__card-item">
            <span>Pièces</span>
            <span class="pricing__card-value">Certifiées</span>
          </div>
        </div>
        <div class="pricing__card-badge">
          Devis Gratuit
        </div>
      </div>
    </div>
  </div>
</section>
