<!-- src/app/components/our-services/our-services.component.html -->
<section class="services">
  <div class="services__container">
    <div class="services__header">
      <h2 class="services__title">{{ data().title }}</h2>
      <p class="services__subtitle">{{ data().subtitle }}</p>
    </div>

    <div class="services__grid">
      @for (service of data().services; track service.title) {
        <article class="service-card" (click)="onServiceClick(service)" tabindex="0" role="button">
          <div class="service-card__image-wrapper">
            <img
              [src]="service.image"
              [alt]="service.title"
              class="service-card__image"
              loading="lazy"
            />
            <div class="service-card__overlay">
              <span class="service-card__icon" aria-hidden="true">{{ service.icon }}</span>
            </div>
          </div>

          <div class="service-card__content">
            <h3 class="service-card__title">{{ service.title }}</h3>
            <p class="service-card__description">{{ service.description }}</p>
            <div class="service-card__footer">
              <span class="service-card__price">{{ service.price }}</span>
              <button
                type="button"
                class="service-card__button"
                (click)="onCtaClick(); $event.stopPropagation()"
                aria-label="Appeler pour ce service"
              >
                <span aria-hidden="true">📞</span>
                Appeler
              </button>
            </div>
          </div>
        </article>
      }
    </div>

    <div class="services__cta">
      <button
        type="button"
        class="services__cta-button"
        (click)="onCtaClick()"
      >
        <span aria-hidden="true">📞</span>
        {{ data().ctaText }} : {{ data().ctaPhone }}
      </button>
    </div>
  </div>
</section>
